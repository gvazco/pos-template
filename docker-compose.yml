version: "3.8"

services:
  dbp:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pos
      MYSQL_USER: gbvazco
      MYSQL_PASSWORD: EF300595
    volumes:
      - ./pos.sql:/docker-entrypoint-initdb.d/pos.sql
    networks:
      - internal

  apipos:
    build:
      context: ./apipos
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - dbp
    networks:
      - internal

  cmspos:
    build:
      context: ./cmspos
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - dbp
    networks:
      - internal

networks:
  internal:
    driver: bridge
